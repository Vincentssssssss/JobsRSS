apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: api
  labels:
    app.kubernetes.io/name: jobsrss
spec:
  healthCheck:
    checkIntervalSec: 15
    timeoutSec: 5
    healthyThreshold: 1
    unhealthyThreshold: 2
    type: HTTP
    requestPath: /healthz
    port: 8000
---
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: frontend
  labels:
    app.kubernetes.io/name: jobsrss
spec:
  healthCheck:
    checkIntervalSec: 15
    timeoutSec: 5
    healthyThreshold: 1
    unhealthyThreshold: 2
    type: HTTP
    requestPath: /
    port: 3000
