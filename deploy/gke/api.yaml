apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    app.kubernetes.io/name: jobsrss
    app.kubernetes.io/component: api
  annotations:
    cloud.google.com/backend-config: '{"default": "api"}'
    cloud.google.com/neg: '{"ingress": true}'
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: jobsrss
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app.kubernetes.io/name: jobsrss
    app.kubernetes.io/component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: jobsrss
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jobsrss
        app.kubernetes.io/component: api
    spec:
      initContainers:
        - name: wait-postgres
          image: postgres:16
          command:
            - /bin/sh
            - -c
            - until pg_isready -h postgres -U "$POSTGRES_USER" -d "$POSTGRES_DB"; do sleep 2; done
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: jobsrss-env
                  key: POSTGRES_USER
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: jobsrss-env
                  key: POSTGRES_DB
      containers:
        - name: api
          image: jobsrss-api:local
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - secretRef:
                name: jobsrss-env
          volumeMounts:
            - name: collector-secrets
              mountPath: /secrets
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 8
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi
      volumes:
        - name: collector-secrets
          secret:
            secretName: jobsrss-collector-files
            optional: true
