apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels:
    app.kubernetes.io/name: jobsrss
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: jobsrss
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jobsrss
        app.kubernetes.io/component: worker
    spec:
      terminationGracePeriodSeconds: 45
      initContainers:
        - name: wait-postgres
          image: postgres:16
          command:
            - /bin/sh
            - -c
            - until pg_isready -h postgres -U "$POSTGRES_USER" -d "$POSTGRES_DB"; do sleep 2; done
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: jobsrss-env
                  key: POSTGRES_USER
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: jobsrss-env
                  key: POSTGRES_DB
      containers:
        - name: worker
          image: jobsrss-api:local
          imagePullPolicy: IfNotPresent
          command: ["python", "worker.py"]
          envFrom:
            - secretRef:
                name: jobsrss-env
          volumeMounts:
            - name: collector-secrets
              mountPath: /secrets
              readOnly: true
            - name: dshm
              mountPath: /dev/shm
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
              ephemeral-storage: 2Gi
            limits:
              memory: 4Gi
              ephemeral-storage: 4Gi
      volumes:
        - name: collector-secrets
          secret:
            secretName: jobsrss-collector-files
            optional: true
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
