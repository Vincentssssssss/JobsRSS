apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: jobsrss-api
  namespace: jobsrss
  labels:
    app.kubernetes.io/name: jobsrss
spec:
  default:
    checkIntervalSec: 15
    timeoutSec: 5
    healthyThreshold: 1
    unhealthyThreshold: 3
    logConfig:
      enabled: true
    config:
      type: HTTP
      httpHealthCheck:
        portSpecification: USE_FIXED_PORT
        port: 8000
        requestPath: /healthz
  targetRef:
    group: ""
    kind: Service
    name: api
---
apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: jobsrss-frontend
  namespace: jobsrss
  labels:
    app.kubernetes.io/name: jobsrss
spec:
  default:
    checkIntervalSec: 15
    timeoutSec: 5
    healthyThreshold: 1
    unhealthyThreshold: 3
    logConfig:
      enabled: true
    config:
      type: HTTP
      httpHealthCheck:
        portSpecification: USE_FIXED_PORT
        port: 3000
        requestPath: /
  targetRef:
    group: ""
    kind: Service
    name: frontend
