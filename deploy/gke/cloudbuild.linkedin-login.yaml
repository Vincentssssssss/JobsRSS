substitutions:
  _API_IMAGE: asia-southeast1-docker.pkg.dev/gcp-bcgx-dev-vincents-d597/jobsrss/jobsrss-api:2adea08
  _LOGIN_IMAGE: asia-southeast1-docker.pkg.dev/gcp-bcgx-dev-vincents-d597/jobsrss/jobsrss-linkedin-login:desktop-2adea08-r2

steps:
  # Pull + build in one docker step. A separate "gcloud auth configure-docker"
  # step does not share credentials with gcr.io/cloud-builders/docker.
  - name: gcr.io/cloud-builders/docker
    id: build-linkedin-login
    entrypoint: bash
    args:
      - -c
      - |
        set -euxo pipefail
        echo "Pulling base ${_API_IMAGE}"
        docker pull "${_API_IMAGE}"
        docker build --progress=plain \
          --build-arg "API_IMAGE=${_API_IMAGE}" \
          -t "${_LOGIN_IMAGE}" \
          -f deploy/gke/linkedin-login/Dockerfile \
          deploy/gke/linkedin-login

images:
  - ${_LOGIN_IMAGE}

options:
  machineType: E2_HIGHCPU_8
  diskSizeGb: 50
  logging: CLOUD_LOGGING_ONLY
  substitutionOption: ALLOW_LOOSE

timeout: 1200s
