apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    app.kubernetes.io/name: jobsrss
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: jobsrss
    app.kubernetes.io/component: frontend
  ports:
    - name: http
      port: 80
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app.kubernetes.io/name: jobsrss
    app.kubernetes.io/component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: jobsrss
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jobsrss
        app.kubernetes.io/component: frontend
    spec:
      containers:
        - name: frontend
          image: jobsrss-frontend:local
          imagePullPolicy: IfNotPresent
          command: ["npm", "run", "start", "--", "--hostname", "0.0.0.0", "--port", "3000"]
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: BACKEND_API_BASE_URLS
              value: http://api:8000
          envFrom:
            - secretRef:
                name: jobsrss-env
                optional: true
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 8
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
