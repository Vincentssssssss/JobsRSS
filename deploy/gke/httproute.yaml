apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: jobsrss
  labels:
    app.kubernetes.io/name: jobsrss
spec:
  parentRefs:
    - name: demo-gateway
      namespace: default
      kind: Gateway
  hostnames:
    - jobsrss.example.invalid
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /healthz
      backendRefs:
        - name: api
          port: 8000
    - matches:
        - path:
            type: PathPrefix
            value: /jobs
      backendRefs:
        - name: api
          port: 8000
    - matches:
        - path:
            type: PathPrefix
            value: /rss
      backendRefs:
        - name: api
          port: 8000
    - matches:
        - path:
            type: PathPrefix
            value: /sources
      backendRefs:
        - name: api
          port: 8000
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: frontend
          port: 80
---
apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: jobsrss-api
  labels:
    app.kubernetes.io/name: jobsrss
spec:
  default:
    checkIntervalSec: 15
    timeoutSec: 5
    healthyThreshold: 1
    unhealthyThreshold: 3
    config:
      type: HTTP
      httpHealthCheck:
        requestPath: /healthz
        port: 8000
  targetRef:
    group: ""
    kind: Service
    name: api
---
apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: jobsrss-frontend
  labels:
    app.kubernetes.io/name: jobsrss
spec:
  default:
    checkIntervalSec: 15
    timeoutSec: 5
    healthyThreshold: 1
    unhealthyThreshold: 3
    config:
      type: HTTP
      httpHealthCheck:
        requestPath: /
        port: 3000
  targetRef:
    group: ""
    kind: Service
    name: frontend
