apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jobsrss
  labels:
    app.kubernetes.io/name: jobsrss
  annotations:
    kubernetes.io/ingress.class: gce
    kubernetes.io/ingress.allow-http: "true"
spec:
  ingressClassName: gce
  rules:
    - http:
        paths:
          - path: /healthz
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8000
          - path: /jobs
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8000
          - path: /rss
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8000
          - path: /sources
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
