apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jobsrss
  labels:
    app.kubernetes.io/name: jobsrss
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "8m"
spec:
  ingressClassName: nginx
  rules:
    - host: jobsrss.example.invalid
      http:
        paths:
          - path: /healthz
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8000
          - path: /jobs
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8000
          - path: /rss
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8000
          - path: /sources
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
