name: jobsrss

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 15s
      timeout: 5s
      retries: 5

  api:
    image: ${ACR_LOGIN_SERVER}/jobsrss-api:${IMAGE_TAG}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file:
      - .env.prod
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./secrets:/secrets:ro
    ports:
      - "${API_PORT:-8000}:8000"
    restart: unless-stopped

  worker:
    image: ${ACR_LOGIN_SERVER}/jobsrss-api:${IMAGE_TAG}
    command: python worker.py
    env_file:
      - .env.prod
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./secrets:/secrets:ro
    restart: unless-stopped

  frontend:
    image: ${ACR_LOGIN_SERVER}/jobsrss-frontend:${IMAGE_TAG}
    command: npm run start -- --hostname 0.0.0.0 --port 3000
    env_file:
      - .env.prod
    environment:
      BACKEND_API_BASE_URLS: ${BACKEND_API_BASE_URLS:-http://api:8000}
    depends_on:
      - api
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    restart: unless-stopped

volumes:
  postgres_data:
