name: Deploy to Azure VM

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Optional image tag override"
        required: false
        type: string
      deploy_ref:
        description: "Git ref to deploy (branch, tag, or sha)"
        required: false
        default: "main"
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.deploy_ref || github.ref_name }}

      - name: Resolve image tag
        id: vars
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.image_tag || '' }}" ]; then
            tag="${{ github.event.inputs.image_tag }}"
          else
            tag="${GITHUB_SHA}"
          fi
          echo "image_tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to ACR
        shell: bash
        run: az acr login --name "${{ secrets.ACR_NAME }}"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/jobsrss-api:${{ steps.vars.outputs.image_tag }}
            ${{ secrets.ACR_LOGIN_SERVER }}/jobsrss-api:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/jobsrss-frontend:${{ steps.vars.outputs.image_tag }}
            ${{ secrets.ACR_LOGIN_SERVER }}/jobsrss-frontend:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload deploy assets to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          port: ${{ secrets.AZURE_VM_PORT || 22 }}
          source: "deploy/azure/vm/docker-compose.prod.yml,deploy/azure/vm/deploy.sh,deploy/azure/vm/.env.prod.example"
          target: "/opt/jobsrss"
          strip_components: 3

      - name: Deploy on VM
        uses: appleboy/ssh-action@v1.0.3
        env:
          ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          port: ${{ secrets.AZURE_VM_PORT || 22 }}
          script_stop: true
          envs: ACR_LOGIN_SERVER,ACR_USERNAME,ACR_PASSWORD,IMAGE_TAG
          script: |
            mkdir -p /opt/jobsrss /opt/jobsrss/secrets
            bash /opt/jobsrss/deploy.sh
